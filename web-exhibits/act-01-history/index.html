<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一木相接 · 从榫卯到斗拱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0906'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23b8402a' font-family='serif'%3E木%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/examples/jsm/loaders/DRACOLoader.js":"./vendor/DRACOLoader.js"}}</script>
</head>
<body>

<!-- 加载幕 -->
<div id="veil" aria-hidden="true">
  <div class="veil-inner">
    <span class="veil-mark">木</span>
    <p class="veil-title">一木相接</p>
    <p class="veil-sub">从榫卯到斗拱</p>
    <div class="veil-bar"><i id="veil-progress"></i></div>
  </div>
</div>

<!-- 三维舞台 -->
<div id="stage" aria-hidden="true"></div>

<!-- 影院氛围层 -->
<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="letterbox letterbox-top" aria-hidden="true"></div>
<div class="letterbox letterbox-bottom" aria-hidden="true"></div>

<!-- 顶部 -->
<header class="masthead">
  <span class="brand">木构之间</span>
  <span class="act">第一幕 · 历史</span>
</header>

<!-- 右侧章节竖轨 -->
<nav class="rail" aria-label="章节">
  <span class="rail-line"><i id="rail-fill"></i></span>
  <button data-step="0"><i>壹</i><span>榫卯初见</span></button>
  <button data-step="1"><i>贰</i><span>走入生活</span></button>
  <button data-step="2"><i>叁</i><span>斗拱之始</span></button>
  <button data-step="3"><i>肆</i><span>历代之变</span></button>
  <button data-step="4"><i>伍</i><span>认识构件</span></button>
  <button data-step="5"><i>陆</i><span>相遇保国寺</span></button>
</nav>

<!-- 时代标签（第四章） -->
<div id="era" aria-hidden="true">
  <span data-era="0">唐 · 佛光寺</span>
  <span data-era="1">宋 · 保国寺</span>
  <span data-era="2">清 · 太和殿</span>
</div>

<!-- 拾取说明卡 -->
<aside id="note" hidden>
  <button id="note-close" aria-label="关闭">×</button>
  <span class="note-eyebrow" id="note-eyebrow">构件</span>
  <h3 id="note-name"></h3>
  <p id="note-text"></p>
</aside>

<!-- 叙事流 -->
<main class="story">

  <section class="panel hero" id="hero">
    <p class="eyebrow">ACT 01 · A STORY OF TIMBER</p>
    <h1>一木相接</h1>
    <p class="sub">从一处榫卯，走到保国寺的檐下</p>
    <div class="scroll-cue"><span>徐 徐 下 滑</span><i></i></div>
  </section>

  <section class="panel" data-chapter="0">
    <div class="caption">
      <span class="num">壹</span>
      <h2>榫卯初见</h2>
      <p class="line">一凸一凹，木与木相握。</p>
    </div>
  </section>

  <section class="panel" data-chapter="1">
    <div class="caption">
      <span class="num">贰</span>
      <h2>走入生活</h2>
      <p class="line">自手中之器，至栖身之所。</p>
    </div>
  </section>

  <section class="panel" data-chapter="2">
    <div class="caption">
      <span class="num">叁</span>
      <h2>斗拱之始</h2>
      <p class="line">檐下层层，木作生花。</p>
    </div>
  </section>

  <section class="panel" data-chapter="3">
    <div class="caption">
      <span class="num">肆</span>
      <h2>历代之变</h2>
      <p class="line">同一屋檐下，时代各有姿态。</p>
    </div>
  </section>

  <section class="panel" data-chapter="4">
    <div class="caption">
      <span class="num">伍</span>
      <h2>认识构件</h2>
      <p class="line">斗 · 栱 · 升 · 昂 · 翘，各有其名。</p>
    </div>
  </section>

  <section class="panel" data-chapter="5">
    <div class="caption">
      <span class="num">陆</span>
      <h2>相遇保国寺</h2>
      <p class="line">大中祥符六年，木构犹在。</p>
      <p class="year">1013</p>
    </div>
  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
